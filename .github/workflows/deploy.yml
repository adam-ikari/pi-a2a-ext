name: Deploy docs site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      # Set to "1" to publish only the holding page. The step below keys off this
      # same value, so the two cannot drift apart.
      DRAFT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap.mjs derives <lastmod> from the last commit touching each
          # source file. The default shallow clone (depth 1) has no history, so
          # git would report the single fetched commit for every page — the
          # exact "everything changed today" signal lastmod must not carry.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # DRAFT=1 publishes a single holding page instead of the site. The
      # extension's shape is still being decided, so the docs describe something
      # that may change. Drop this env var (and the one in ci.yml) to bring the
      # site back — the repo's markdown was never touched.
      - run: bun install
      - run: bun run build
      # The diagrams render client-side, so a green build does not prove they
      # appear. Load the built site in a real browser and assert on the text
      # inside the rendered SVG.
      #
      # Skipped under DRAFT: the pages this asserts on are not published, so a
      # failure here would say nothing about the holding page. The build step
      # still catches dead links in whatever *is* published.
      - run: bun run check
        if: env.DRAFT != '1'
      # VitePress config reads GITHUB_REPOSITORY to derive `base` for project pages.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
